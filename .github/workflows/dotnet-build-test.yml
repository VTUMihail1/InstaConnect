name: Build & Test

on:
  push:
  pull_request:

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.200-preview.0.26103.119'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ./InstaConnect.sln

      - name: Check formatting
        run: dotnet format ./InstaConnect.sln --verify-no-changes

      - name: Check for vulnerable packages
        run: |
          OUTPUT=$(dotnet list ./InstaConnect.sln package --vulnerable --include-transitive 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            exit 1
          fi

      - name: Build solution
        run: dotnet build ./InstaConnect.sln --configuration Release --no-restore

      - name: Install dotnet-retest
        run: dotnet tool install --global dotnet-retest --version 1.0.0

      - name: Run tests
        env:
          DOTNET_ROLL_FORWARD: Major
        run: >
          dotnet retest
          --retries 3
          --gh-comment false
          --
          ./InstaConnect.sln
          --configuration Release
          --no-restore
          --no-build
          --logger "trx"
          --results-directory ./test-results
          --blame-hang-timeout 3m

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx
