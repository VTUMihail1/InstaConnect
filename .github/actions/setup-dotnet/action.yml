name: Set up .NET
description: Installs the .NET SDK from global.json, restores the NuGet package cache and restores local .NET tools.

inputs:
  save-cache:
    description: Whether to save the NuGet package cache at the end of the job. Only one job per run should save it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore and save NuGet cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '.config/dotnet-tools.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore NuGet cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '.config/dotnet-tools.json', 'Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore .NET tools
      shell: bash
      run: dotnet tool restore
