name: Feature request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: service
    attributes:
      label: Service
      options: [Identity, Posts, Chats, Follows, Gateway / infrastructure, New service]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
